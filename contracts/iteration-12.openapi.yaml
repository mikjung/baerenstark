openapi: 3.1.0
info:
  title: Bärenstark Hausservice — Iteration 12 API (Post-QA Revision)
  version: "12.1"
  description: |
    Iteration-12 API-Vertrag, post QA-Review revidiert (2026-05-04).

    Single-Source-of-Truth für alle Endpoints von IT12-S05 (Konto aus
    Buchung), IT12-S15 (Marketing-Mails inkl. Test-Send + Unsubscribe)
    und für korrigierte Specs der Bug-Stories S06/S12/S13.

    Konventionen:
    - REST/JSON über HTTPS.
    - Auth: Cookie-basiert (siehe securitySchemes).
    - Error-Format: `{ error: { code, message, field?, subcode? } }`.
    - Hard-Cap Marketing-Send IT12: 50 Empfänger pro Send-Operation
      (Vercel-Hobby-Timeout-Constraint).
    - Plain-Text Marketing-Mails only in IT12.
    - Daily-Cap Marketing: 100 Mails/Tag (Resend Free-Tier).
    - DSGVO: UWG §7 Abs. 3 (Bestandskunden), Opt-Out via Unsubscribe-Token (HMAC, stateless).

servers:
  - url: https://www.baerenstark-hausservice.app
    description: Production
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: Customer
    description: Endpoints des Kunden-Bereichs.
  - name: Admin
    description: Endpoints des Admin-Bereichs (Auth via Admin-Session).
  - name: Marketing
    description: Marketing-E-Mail und Unsubscribe.
  - name: Booking
    description: Buchungsendpoints — IT12 Verify-Specs.

paths:

  /api/customer/register-from-booking:
    post:
      operationId: registerFromBooking
      summary: Konto aus einer Gast-Buchung erstellen (IT12-S05)
      description: |
        Public, Token-gated. Erstellt einen `CustomerUser` aus einer
        bestehenden Gast-Buchung. Verknüpft alle Bookings mit derselben
        E-Mail (case-insensitive) auf den neuen Account.

        Idempotenz: Wiederholtes Aufrufen mit demselben Token + bookingId
        liefert 409 wenn das Konto schon existiert. Frontend behandelt das
        als „bereits angelegt" und redirect'et zum Login.
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFromBookingRequest'
      responses:
        '201':
          description: Konto erfolgreich erstellt, Customer-Session-Cookie gesetzt.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "customer-session=...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=2592000"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterFromBookingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token ungültig oder abgelaufen (subcode INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Booking nicht gefunden (subcode BOOKING_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Konto mit dieser E-Mail existiert bereits (subcode ACCOUNT_EXISTS).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiError'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          subcode:
                            type: string
                            enum: [ACCOUNT_EXISTS]
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/bookings:
    post:
      operationId: createBooking
      summary: Neue Buchungsanfrage anlegen (mit Idempotency, IT12-S11)
      description: |
        Optional `Idempotency-Key` Header (UUID). Bei doppeltem Submit mit
        gleichem Key innerhalb 24h: cached Response, kein neuer Insert.
      tags: [Booking]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: UUID, vom Frontend pro Submit generiert.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Buchung angelegt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Slot bereits vergeben (subcode SLOT_TAKEN) oder Idempotency-Conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: getAdminBookings
      summary: Alle Buchungsanfragen (Admin) — IT12-S13 verify
      description: |
        Bug-Fix in IT12-S13: Endpoint funktioniert nach `prisma migrate deploy`.
      tags: [Admin, Booking]
      security:
        - adminSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, CONFIRMED, REJECTED, COUNTER_PROPOSED, CANCELLED, COMPLETED]
      responses:
        '200':
          description: Liste der Buchungen.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/marketing/recipients:
    get:
      operationId: listMarketingRecipients
      summary: Liste potentieller Marketing-Empfänger mit Filter (IT12-S15)
      description: |
        Liefert Customer-Auswahl gefiltert nach Service, Buchungs-Status
        und Unsubscribe-Status. Ersetzt früheren Pfad
        `/api/admin/customers/marketing-list`.
      tags: [Admin, Marketing]
      security:
        - adminSession: []
      parameters:
        - name: service
          in: query
          required: false
          description: Komma-getrennte Service-Slugs (z.B. "entruempelung,reinigung").
          schema:
            type: string
            example: "entruempelung,reinigung"
        - name: hasBooked
          in: query
          required: false
          description: Nur Customer mit mind. einer COMPLETED-Booking. Default true.
          schema: { type: boolean, default: true }
        - name: unsubscribed
          in: query
          required: false
          description: Filter auf Unsubscribe-Status. Wenn weggelassen → beide.
          schema: { type: boolean }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Paginierte Liste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingRecipientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/marketing/emails:
    post:
      operationId: createMarketingEmail
      summary: Marketing-E-Mail anlegen (Draft oder direkt senden) (IT12-S15)
      description: |
        Legt eine `MarketingEmail` an. Bei `status: "send"` wird sofort
        Bulk-Send getriggert. Bei `status: "draft"` nur Persistenz, dann
        kann separat `/{id}/test-send` und `/{id}/send` aufgerufen werden.

        Hard-Cap: max 50 Empfänger pro Send-Operation (Vercel-Hobby-Timeout).
      tags: [Admin, Marketing]
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarketingEmailRequest'
      responses:
        '201':
          description: Marketing-Mail angelegt (Draft) oder direkt versandt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingEmailCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Empfängerliste übersteigt Hard-Cap (subcode RECIPIENT_CAP_EXCEEDED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: Daily-Quota überschritten (subcode DAILY_QUOTA_EXCEEDED) oder Rate-Limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      operationId: listMarketingEmails
      summary: Marketing-Mail-Historie (IT12-S15)
      tags: [Admin, Marketing]
      security:
        - adminSession: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Liste vergangener Marketing-Mails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingEmailListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/marketing/emails/{id}:
    get:
      operationId: getMarketingEmail
      summary: Marketing-Mail-Detail + Audit (IT12-S15)
      tags: [Admin, Marketing]
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detail mit Audit-Sicht.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingEmailDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nicht gefunden.
    patch:
      operationId: patchMarketingEmail
      summary: Draft Subject/Body aktualisieren (IT12-S15 / FIND-002)
      description: |
        Erlaubt das Aktualisieren von `subject` und/oder `body` einer
        Draft-Marketing-Mail. Wird vom Composer-Auto-Save aufgerufen, damit
        Tom seinen Draft mehrfach editieren kann ohne dass die DB-Werte
        stale werden.

        Constraints:
          - Mail muss `status === 'draft'` haben — sonst 409 EMAIL_NOT_DRAFT.
          - Mindestens eines von `subject` oder `body` muss gesetzt sein.
          - `subject` 1..200, `body` 1..5000.
      tags: [Admin, Marketing]
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                subject:
                  type: string
                  minLength: 1
                  maxLength: 200
                body:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: Draft aktualisiert.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, subject, bodyText, status]
                    properties:
                      id: { type: string }
                      subject: { type: string }
                      bodyText: { type: string }
                      status: { type: string, enum: [draft] }
        '400':
          description: Validation-Error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nicht gefunden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Mail nicht im Status 'draft' (subcode EMAIL_NOT_DRAFT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/admin/marketing/emails/{id}/test-send:
    post:
      operationId: testSendMarketingEmail
      summary: Test-Send an Admin-Email (IT12-S15)
      description: |
        Sendet die (Draft-)Mail an die Admin-Email-Adresse aus der Session.
        Kein Audit-Insert. Voraussetzung: `MarketingEmail.status === 'draft'`.
      tags: [Admin, Marketing]
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Test-Mail erfolgreich an Admin gesendet.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sentTo]
                properties:
                  ok: { type: boolean, enum: [true] }
                  sentTo:
                    type: string
                    format: email
                    description: Admin-Email aus Session.
        '400':
          description: Mail nicht im Status 'draft' (subcode EMAIL_NOT_DRAFT).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Resend-Fehler (subcode RESEND_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/admin/marketing/emails/{id}/send:
    post:
      operationId: sendMarketingEmail
      summary: Bulk-Send einer (Draft-)Marketing-Mail (IT12-S15)
      description: |
        Synchroner Versand mit Concurrency 5 + 200ms-Throttle. Hard-Cap
        50 Empfänger.

        IT12 Bug-Fix-Loop (BUG-001 + BUG-003 + BUG-004):
          - RequestBody ist optional + flexibel:
            * Wenn `recipientIds` mitgegeben: Backend sendet an genau diese
              Customer-IDs (nach UWG-Filter, s.u.).
            * Wenn `subject` und/oder `body` mitgegeben: Backend persistiert
              die Werte VOR dem Send auf der MarketingEmail (FIND-002:
              Tom kann den Draft beim Send noch editieren).
            * Wenn der Body leer/missing ist: Fallback auf die in der DB
              gespeicherten Werte (Subject/Body aus dem Draft, Recipients
              aus der `MarketingEmailRecipient`-Tabelle, falls vorhanden).
          - UWG §7 Abs. 3: Backend filtert HART gegen Bestandskunden (mind.
            eine COMPLETED-Booking) und `unsubscribedAt = null`. Wenn
            mindestens ein angegebener Recipient nach Filter wegfällt →
            422 INVALID_RECIPIENTS mit der Liste der ausgeschlossenen IDs
            (Header `X-Excluded-Ids`, comma-separated; auch
            `excludedRecipientIds` als Body-Header `X-Excluded-Count`).
            Tom soll die Auswahl bewusst korrigieren.
          - Daily-Cap 100/Tag (Resend Free-Tier).
      tags: [Admin, Marketing]
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: |
          Optional. Wenn alle Felder fehlen, fällt der Endpoint auf die
          DB-Werte zurück (Bestand-Verhalten "resend draft as-is").
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingEmailSendRequest'
      responses:
        '200':
          description: Versand abgeschlossen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingEmailSendResponse'
        '400':
          description: Mail nicht im Status 'draft' (subcode EMAIL_NOT_DRAFT) oder Validierungsfehler.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Marketing-Mail nicht gefunden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '413':
          description: Empfänger > 50 (subcode RECIPIENT_CAP_EXCEEDED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: |
            UWG §7 Abs. 3 — mindestens ein angeforderter Recipient ist kein
            zulässiger Empfänger (kein Bestandskunde mit COMPLETED-Booking,
            unsubscribed oder Email leer). Subcode `INVALID_RECIPIENTS`.
            Header `X-Excluded-Count` und `X-Excluded-Ids` (comma-separated)
            geben Audit-Transparenz.
          headers:
            X-Excluded-Count:
              description: Anzahl der ausgeschlossenen IDs.
              schema: { type: integer }
            X-Excluded-Ids:
              description: Komma-separierte Liste der ausgeschlossenen Customer-IDs.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: Daily-Quota überschritten oder Rate-Limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '502':
          description: Resend komplett ausgefallen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/customer/unsubscribe:
    get:
      operationId: customerUnsubscribe
      summary: Marketing-Abmeldung via HMAC-Token (IT12-S15)
      description: |
        Public Endpoint. Verifiziert HMAC-Token (stateless, deterministisch
        aus customerId + UNSUBSCRIBE_TOKEN_SECRET). Setzt
        `CustomerUser.unsubscribedAt = now()`. Antwortet mit Redirect.
      tags: [Customer, Marketing]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Erfolgreiche Abmeldung, Redirect auf `/marketing/abgemeldet?ok=1`.
        '404':
          description: Token ungültig, Redirect auf `/marketing/abgemeldet?error=invalid`.

  /api/availability/calendar:
    get:
      operationId: getAvailabilityCalendar
      summary: Verfügbarkeits-Kalender (IT12-S03)
      description: |
        Performance-Target: p95 < 300ms bei 62-Tage-Range, 100 Bookings,
        kalter Cache. Indizes verifiziert in Build-Phase.
      tags: [Booking]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Tages-Aggregation für den Range.
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/customer/bookings:
    get:
      operationId: getCustomerBookings
      summary: Meine Buchungen (eingeloggter Customer) — IT12-S06 verify
      tags: [Customer, Booking]
      security:
        - customerSession: []
      responses:
        '200':
          description: Buchungen, gesplittet in upcoming / past.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBookingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/upcoming-bookings:
    get:
      operationId: getAdminUpcomingBookings
      summary: Bevorstehende Termine (Admin) — IT12-S12 verify
      tags: [Admin, Booking]
      security:
        - adminSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Liste bevorstehender bestätigter Termine.
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth-v5-Admin-Cookie (Credentials-Provider).
    customerSession:
      type: apiKey
      in: cookie
      name: customer-session
      description: |
        Custom-JWT-Cookie für Customer-Auth (siehe lib/customer-auth.ts).

  schemas:

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            field:
              type: string
              nullable: true
            subcode:
              type: string
              nullable: true
              description: |
                Bekannte Subcodes:
                ACCOUNT_EXISTS, INVALID_TOKEN, BOOKING_NOT_FOUND,
                SLOT_TAKEN, EMAIL_NOT_DRAFT, RECIPIENT_CAP_EXCEEDED,
                DAILY_QUOTA_EXCEEDED, RESEND_ERROR.

    RegisterFromBookingRequest:
      type: object
      required: [bookingId, confirmationToken, password]
      properties:
        bookingId:
          type: string
          minLength: 1
        confirmationToken:
          type: string
          minLength: 1
          description: |
            Signed JWT mit scope=booking-confirmation. Wird beim Erstellen
            der Buchung generiert und in der Bestätigungs-URL übergeben.
        password:
          type: string
          minLength: 12
          maxLength: 200

    RegisterFromBookingResponse:
      type: object
      required: [customerId, linkedBookingsCount]
      properties:
        customerId:
          type: string
        linkedBookingsCount:
          type: integer
          minimum: 1

    MarketingRecipient:
      type: object
      required: [customerId, email, firstName, lastName, bookedServices, completedBookingCount]
      properties:
        customerId: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        bookedServices:
          type: array
          items:
            type: string
            enum: [entruempelung, entkernung, reinigung, gruenflaechenpflege, muelltonnenservice, entsorgung, sonstiges]
        completedBookingCount: { type: integer, minimum: 0 }
        lastBookingAt:
          type: string
          format: date-time
          nullable: true
        unsubscribedAt:
          type: string
          format: date-time
          nullable: true
          description: Null = aktiv, Wert = abgemeldet (DSGVO-Filter).

    MarketingRecipientListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MarketingRecipient' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        dailyQuotaRemaining:
          type: integer
          description: Hilfsfeld für UI-Quota-Anzeige (Resend Free 100/Tag).
          minimum: 0

    CreateMarketingEmailRequest:
      type: object
      required: [subject, body, recipientIds, status]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: |
            Plain-Text. Backend hängt automatisch DSGVO-Footer mit
            Unsubscribe-Link an. Templating: `{{firstName}}` wird
            substituiert.
        recipientIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
        filterServices:
          type: array
          description: Audit-Field — welche Service-Filter waren beim Senden aktiv.
          items:
            type: string
            enum: [entruempelung, entkernung, reinigung, gruenflaechenpflege, muelltonnenservice, entsorgung, sonstiges]
        status:
          type: string
          enum: [draft, send]
          description: |
            'draft' = nur persistieren; 'send' = direkt nach Anlegen
            den Send-Endpoint aufrufen.

    MarketingEmailCreatedResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [draft, sent, partial_failure, failed]
        # Bei status='send' werden auch die Send-Felder mitgeliefert:
        intendedRecipients: { type: integer, nullable: true }
        actualRecipients: { type: integer, nullable: true }
        successCount: { type: integer, nullable: true }
        failureCount: { type: integer, nullable: true }

    MarketingEmailSendRequest:
      type: object
      description: |
        Optional bei `POST /api/admin/marketing/emails/{id}/send`. Alle
        Felder sind optional. Verhalten:
          - `recipientIds` gegeben: Backend sendet exakt an diese IDs
            (nach UWG-Filter — siehe 422-Pfad).
          - `recipientIds` leer/fehlend: Backend nutzt die zur MarketingEmail
            persistierten `MarketingEmailRecipient`-Customer-IDs (sofern
            vorhanden); sonst 400 VALIDATION_ERROR.
          - `subject` und/oder `body` gegeben: Backend persistiert die Werte
            VOR dem Send (FIND-002 — Composer-Edit beim Send).
          - `subject` und `body` fehlend: Backend nutzt die DB-Werte aus dem
            Draft.
      properties:
        recipientIds:
          type: array
          items: { type: string, minLength: 1 }
          minItems: 1
          maxItems: 50
          description: Customer-IDs der Empfänger. Hard-Cap 50.
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 5000

    MarketingEmailSendResponse:
      type: object
      required: [id, intendedRecipients, actualRecipients, successCount, failureCount, status]
      properties:
        id: { type: string }
        intendedRecipients:
          type: integer
          description: Anzahl der angeforderten Empfänger.
        actualRecipients:
          type: integer
          description: |
            Anzahl der tatsächlich versendeten Empfänger nach Filter
            (unsubscribedAt != null oder kein Bestandskunde werden
            ausgeschlossen).
        successCount: { type: integer }
        failureCount: { type: integer }
        status:
          type: string
          enum: [sent, partial_failure, failed]
        failedRecipients:
          type: array
          items:
            type: object
            properties:
              email: { type: string, format: email }
              errorMessage: { type: string }
        excludedRecipientIds:
          type: array
          description: |
            IT12 BUG-003: IDs, die wegen UWG-Filter herausgefiltert wurden
            (kein Bestandskunde mit COMPLETED-Booking, unsubscribed oder
            fehlende Email). Im strict-Pfad (`/send`) führt jede
            Ausschluss-ID zu 422 — diese Liste ist deshalb hier nur in der
            inline-send-Variante (`POST /api/admin/marketing/emails`
            status='send') befüllt.
          items: { type: string }

    MarketingEmailDetailResponse:
