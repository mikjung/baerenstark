      properties:
        id: { type: string }
        subject: { type: string }
        bodyText: { type: string }
        filterServices:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt:
          type: string
          format: date-time
          nullable: true
        recipientCount: { type: integer }
        successCount: { type: integer }
        failureCount: { type: integer }
        status:
          type: string
          enum: [draft, queued, sending, sent, partial_failure, failed]
        failedRecipients:
          type: array
          items:
            type: object
            properties:
              email: { type: string, format: email }
              errorMessage: { type: string }

    MarketingEmailListItem:
      type: object
      required: [id, subject, recipientCount, status, createdAt]
      properties:
        id: { type: string }
        subject: { type: string }
        recipientCount: { type: integer }
        successCount: { type: integer }
        failureCount: { type: integer }
        status:
          type: string
          enum: [draft, queued, sending, sent, partial_failure, failed]
        createdAt: { type: string, format: date-time }
        completedAt:
          type: string
          format: date-time
          nullable: true

    MarketingEmailListResponse:
