openapi: 3.1.0
info:
  title: Bärenstark Hausservice — Iteration 14 API (Bug- und Härtungs-Iteration)
  version: "14.1"
  description: |
    Iteration 14 — geänderte Endpoints für die 8 Bug/Härtungs-Stories.
    Ergänzt iteration-12.openapi.yaml (Bestand) — alle anderen Endpoints
    bleiben unverändert.

    Rev 2 (2026-05-04): nach QA-Design-Review folgendes finalisiert:
      - PaymentMethod-Enum auf ['CASH', 'BANK_TRANSFER'] reduziert
        (STRIPE/CARD/INVOICE entfallen, siehe ARCHITECTURE_IT14.md §4.2).
      - S06 Calendar-URL: zurück auf /admin/bookings/{id} (Detail-Route
        wird neu angelegt, Anker-Pattern verworfen).
      - 401-Response-Shape vereinheitlicht: { error: { code, message } }.

    Geänderte Endpoints:
      - GET  /api/bookings              (S04: finalPriceEur + finalPriceNote
                                          + paymentMethod ergänzt)
      - PATCH /api/admin/bookings/[id]  (S05: paymentMethod im Body und
                                          Response)
      - GET  /api/admin/analytics       (S07: KPI completedBookings zählt
                                          jetzt ALLE COMPLETED, nicht nur
                                          mit Preis)
      - GET  /api/admin/calendar/events (S06: url zeigt jetzt auf
                                          /admin/bookings/{id} — Detail-
                                          Route neu)
      - GET  /admin/bookings/{id}       (S06: NEU — Server-Component-Page,
                                          ersetzt das vormalige
                                          „Tab+Anker"-Pattern)
      - Middleware /admin/** + /api/admin/**
                                        (S02: Auth-Gate verstärkt,
                                          einheitliches 401-Shape)

servers:
  - url: https://www.baerenstark-hausservice.app
    description: Production
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: Admin
    description: Endpoints des Admin-Bereichs (Auth via Admin-Session).
  - name: Booking
    description: Buchungsendpoints (Public + Admin).
  - name: Analytics
    description: Auswertungen für Tom.

paths:

  # ----------------------------------------------------------------
  # S04 — GET /api/bookings (admin list) muss finalPriceEur + Note +
  #       paymentMethod ausspielen. Bestehender PATCH war OK — die
  #       Liste hat die Felder vergessen.
  # ----------------------------------------------------------------
  /api/bookings:
    get:
      operationId: listBookingsAdmin
      summary: Liste aller Buchungen (Admin) — IT14-S04 Korrektur.
      description: |
        Bestehender Endpoint. IT14-S04: Response enthält jetzt
        `finalPriceEur`, `finalPriceNote` und `paymentMethod` —
        vorher waren diese Felder im Mapping vergessen worden,
        was das Symptom „Preis wird nicht gespeichert" verursacht hat.
      tags: [Booking, Admin]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingAdminIT14'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------
  # S05 — PATCH /api/admin/bookings/[id] um paymentMethod erweitern.
  # ----------------------------------------------------------------
  /api/admin/bookings/{id}:
    patch:
      operationId: updateAdminBooking
      summary: Buchung aktualisieren (Status, finalPrice, paymentMethod).
      description: |
        IT14-S05 (Rev 2) ergänzt das Body-Schema um `paymentMethod`
        (`'CASH'|'BANK_TRANSFER'|null`). Response enthält den
        Wert ebenfalls. Alle anderen Body-Felder unverändert (IT6).
      tags: [Booking, Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingPatchInputIT14'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminBookingPatchResponseIT14'
        '400':
          description: Validation-Fehler (z.B. paymentMethod nicht in Whitelist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Buchung nicht gefunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: State-Machine-Konflikt (z.B. CANCELLED → CONFIRMED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ----------------------------------------------------------------
  # S06 — GET /api/admin/calendar/events liefert geänderte url-Schema.
  # ----------------------------------------------------------------
  /api/admin/calendar/events:
    get:
      operationId: getCalendarEvents
      summary: FullCalendar-Events (Admin) — IT14-S06 Link-Fix.
      description: |
        IT14-S06: Das `url`-Feld in BOOKING-Events zeigt auf die neu
        angelegte Detail-Route `/admin/bookings/{id}` (Server-Component-
        Page wird in IT14 neu erstellt, ersetzt das frühere Anker-
        Pattern). Bei `BUFFER`/`AVAILABILITY`-Events bleibt `url`
        ungesetzt (nullable in der Response).
      tags: [Admin]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------
  # S06 — NEU: GET /admin/bookings/{id} (Server-Component-Page).
  # Strikt genommen kein JSON-API, aber die Route ist Vertragsbestandteil
  # für Calendar-Links. Dokumentiert hier zur Vollständigkeit.
  # ----------------------------------------------------------------
  /admin/bookings/{id}:
    get:
      operationId: getAdminBookingDetailPage
      summary: Buchungs-Detail-Page (HTML, Admin) — IT14-S06 NEU.
      description: |
        Server-Component-Page, neu in IT14. Ersetzt das frühere
        Anker-Pattern `/admin?tab=bookings&focus=…`. Auth-Gate:
        `requireActiveAdmin()` als erste Anweisung in der Page.
        Bei nicht existierender Booking-ID → `notFound()` → Next.js
        404-Page.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML-Detail-Page der Buchung.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect zu /admin/login (Auth-Gate ohne Session).
        '404':
          description: Buchung nicht gefunden.

  # ----------------------------------------------------------------
  # S07 — GET /api/admin/analytics — completedBookings-Definition geändert.
  # ----------------------------------------------------------------
  /api/admin/analytics:
    get:
      operationId: getAnalytics
      summary: Auswertungen — IT14-S07 Korrektur.
      description: |
        IT14-S07: `kpis.completedBookings` zählt jetzt ALLE Bookings
        mit `status='COMPLETED'` im Range — auch solche ohne
        `finalPriceEur`. Vorher hat der Filter `finalPriceEur != null`
        in der Aggregation auch die KPI-Anzahl reduziert.
        `totalRevenueEur` und `averageOrderValueEur` bleiben
        unverändert auf Bookings MIT Preis gefiltert (sonst keine
        Aussage).
      tags: [Analytics, Admin]
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: ['30d', '90d', '12m', 'ytd', 'custom']
            default: '12m'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnalyticsResponse'

components:

  schemas:

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, COUNTER_PROPOSED, CANCELLED, COMPLETED]

    PaymentMethod:
      type: string
      enum: [CASH, BANK_TRANSFER]
      description: |
        IT14-S05 (Rev 2) — Zahlungsart, von Tom intern erfasst. NULL =
        nicht erfasst (Default für Bestand-Buchungen und neue Customer-
        Buchungen ohne Admin-Edit). STRIPE/CARD/INVOICE wurden bewusst
        nicht aufgenommen — Tom hat aktuell weder Stripe-Admin-UI noch
        Karten-Hardware. Wenn Stripe später reaktiviert wird, kommt
        STRIPE in den Enum + Backfill-Migration für existing Stripe-
        Bookings (`payment.status = 'PAID'` → `paymentMethod = 'STRIPE'`).

    BookingAdminIT14:
      description: |
        Erweiterung von BookingAdmin (IT12) um IT6-Felder
        (finalPriceEur, finalPriceNote) und IT14-Feld (paymentMethod).
      allOf:
        - $ref: '#/components/schemas/BookingAdmin_IT12'
        - type: object
          properties:
            finalPriceEur:
              type: string
              nullable: true
              description: Decimal-String (z.B. "150.00") oder null.
            finalPriceNote:
              type: string
              nullable: true
            paymentMethod:
              oneOf:
                - $ref: '#/components/schemas/PaymentMethod'
                - type: 'null'

    BookingAdmin_IT12:
      type: object
      description: |
        Bestand-Schema aus iteration-12 (Felder unverändert). Vollständige
        Definition siehe iteration-12.openapi.yaml.
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        # ... weitere Bestandsfelder, hier ausgelassen.

    AdminBookingPatchInputIT14:
      type: object
      description: |
        Body für PATCH /api/admin/bookings/{id}. Mindestens ein Feld
        muss gesetzt sein (Zod-superRefine).
      properties:
        status:
          $ref: '#/components/schemas/BookingStatus'
        finalPriceEur:
          oneOf:
            - type: string
              description: Komma- oder Punkt-Notation (z.B. "150,00").
            - type: number
            - type: 'null'
          description: 0..100000. null = entfernen.
        finalPriceNote:
          type: string
          nullable: true
          maxLength: 200
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
      additionalProperties: false

    AdminBookingPatchResponseIT14:
      type: object
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        finalPriceEur: { type: string, nullable: true }
        finalPriceNote: { type: string, nullable: true }
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        updatedAt: { type: string, format: date-time }

    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [BOOKING, BUFFER, AVAILABILITY]
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status:
          oneOf:
            - $ref: '#/components/schemas/BookingStatus'
            - type: 'null'
        color: { type: string }
        url:
          type: string
          nullable: true
          description: |
            IT14-S06 (Rev 2) — Pfad zur Buchungsdetail-Anzeige. Format:
            `/admin/bookings/{id}` (neue Detail-Route, in IT14 als
            Server-Component-Page angelegt). NULL/undefined für
            BUFFER/AVAILABILITY-Events — Frontend MUSS in diesem Fall
            den „Buchung öffnen"-Button NICHT rendern.

    AnalyticsResponse:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        kpis:
          type: object
          properties:
            totalRevenueEur:
              type: string
              nullable: true
              description: Decimal-String. NULL wenn keine Aufträge mit Preis.
            completedBookings:
              type: integer
              description: |
                IT14-S07: zählt ALLE Bookings mit status='COMPLETED' im
                Range, auch ohne finalPriceEur (vorher hat der Filter
                Aufträge ohne Preis aus dem Count entfernt).
            averageOrderValueEur:
              type: string
              nullable: true
            bookingsThisMonth:
              type: integer
        revenueByMonth:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              totalEur: { type: string }
              count: { type: integer }
        bookingsByService:
          type: array
          items:
            type: object
            properties:
              service: { type: string }
              count: { type: integer }
        topCustomers:
          type: array
          items:
            type: object
            properties:
              customerId: { type: string }
              customerName: { type: string }
              totalEur: { type: string }
              bookingCount: { type: integer }

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Machine-readable error code. Bekannte Werte:
                - UNAUTHORIZED (401, fehlende Session)
                - FORBIDDEN    (403, Admin DISABLED oder fehlende Rolle)
                - VALIDATION_ERROR (400, Zod-Fehler)
                - NOT_FOUND (404)
                - CONFLICT (409, State-Machine-Konflikt)
                - INTERNAL_ERROR (500)
            message:
              type: string
              description: Deutscher User-Text, frontendgeeignet.
            field:
              type: string
              description: (Optional) Feldname bei VALIDATION_ERROR.
            subcode:
              type: string
              description: (Optional) Sub-Klassifikation.

  responses:
    Unauthorized:
      description: |
        IT14-S02 (Rev 2) — Einheitliche 401-Shape von BEIDEN Schichten:
        Middleware (für /api/admin/** ohne gültige Admin-Session) UND
        Route-Handler-Helper `requireAdmin()` (DISABLED-Check + Detail-
        Logging). Beide liefern dasselbe JSON-Format
        `{ "error": { "code": "UNAUTHORIZED", "message": "Bitte einloggen." } }`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
            example:
              error:
                code: UNAUTHORIZED
                message: Bitte einloggen.
    Forbidden:
      description: |
        IT14-S02 — Account existiert, aber `User.status !== 'ACTIVE'`
        (DISABLED). Wird ausschließlich vom Route-Handler-Helper
        `requireAdmin()` gesendet (Middleware kann den Status nicht
        prüfen ohne DB-Lookup).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
            example:
              error:
                code: FORBIDDEN
                message: Ihr Konto wurde deaktiviert. Bitte wenden Sie sich an Tom Siefert.
